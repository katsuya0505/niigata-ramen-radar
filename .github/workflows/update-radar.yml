name: Update Ramen Radar

on:
  workflow_dispatch:

  schedule:
    # 日本時間 3時・9時・15時・21時
    - cron: "0 0,6,12,18 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install packages
        run: python -m pip install -r requirements.txt

      - name: Scan ramen sources
        run: python collector.py

      - name: Commit updated data
        run: |
          git config user.name "ramen-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ramen.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update ramen radar data"
            git push
          fi
